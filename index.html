<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic Marketplace · Together for Good 2026</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #00355F;
    --orange: #E37F1C;
    --green: #82A52C;
    --teal: #5B9B98;
    --sky: #88CBDF;
    --bg: #F5F9FC;
    --panel: #E3EEF4;
    --ink: #1c2b39;
    --muted: #6b7c8c;
    --am-ink: #2F6E6B;  /* darker teal/orange for label text: 5.9:1 and 5.3:1 on white */
    --pm-ink: #A85400;
    --u: 16px;  /* card text size, set per card by fit() */
    --uh: 20px; /* room-name size, shared, set by fit() */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Work Sans", Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  /* ---------- header ---------- */
  header {
    background: #fff;
    display: flex;
    align-items: center;
    gap: 1.4vw;
    padding: .6vh 1.2vw;
    border-bottom: .6vh solid var(--orange);
    flex: 0 0 auto;
  }
  header .logo { height: 7vh; width: auto; display: block; }
  header h1 { margin: 0; font-size: 3.6vh; font-weight: 800; color: var(--navy); letter-spacing: .01em; }
  header .sub { font-size: 2vh; color: var(--muted); }
  header .sub:empty { display: none; }
  header .qr { margin-left: auto; display: flex; align-items: center; gap: .8vw; text-decoration: none; color: var(--navy); }
  header .qr span { font-size: 1.9vh; font-weight: 400; line-height: 1.3; text-align: right; }
  header .qr b { font-weight: 600; }
  header .qr .more { font-size: .85em; font-weight: 600; vertical-align: .05em; margin: 0 .1em; }
  header .qr img { height: 7vh; width: 7vh; display: block; }

  /* ---------- layout ---------- */
  /* Presentation: everything fits one screen. Rows share their width between cards (a split room
     counts double); rooms with a Group (Sheet column G) sit together in a labelled panel. */
  body.present { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  main {
    flex: 1 1 auto;
    min-height: 0;
    padding: 1.2vh 1vw 1vh;
    display: flex;
    flex-direction: column;
    gap: 1vh;
  }
  .group { flex: 1 1 0; min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 1vh; }
  /* Side-by-side: groups become columns (Ballroom | Meeting rooms) with the same number of rows,
     so every card comes out the same size. */
  main.side { flex-direction: row; gap: .8vw; }
  /* Each group panel gets its own tint and a coloured top edge (cycles if there are more groups). */
  .group.labelled {
    --gbg: #DDEFF6; --gedge: var(--sky); --gink: var(--navy);
    background: var(--gbg); border-top: .6vh solid var(--gedge);
    border-radius: .6vh; padding: .5vh .5vw .8vh; gap: .8vh;
  }
  .group.labelled.tone-1 { --gbg: #ECF2DE; --gedge: var(--green); --gink: #4F6A14; }
  .glabel {
    flex: 0 0 auto; font-size: 2.1vh; font-weight: 800; letter-spacing: .14em;
    text-transform: uppercase; color: var(--gink); padding-left: .2vw;
  }
  .row { flex: 1 1 0; min-height: 0; display: flex; gap: .8vw; }

  /* ---------- cards ---------- */
  .card {
    flex: var(--w, 1) 1 0;
    min-width: 0;
    min-height: 0;
    background: #fff;
    border-radius: .4em;
    box-shadow: 0 1px 3px rgba(0,53,95,.18);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-size: var(--u);
    cursor: pointer;
    position: relative;
  }
  .card:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  .card h2 {
    margin: 0;
    background: var(--navy);
    color: #fff;
    font-size: var(--uh);
    font-weight: 700;
    line-height: 1.15;
    padding: .2em .5em;
    flex: 0 0 auto;
  }
  .card.special h2 { background: var(--teal); }
  /* Split room ("Canal - 1" + "Canal - 2"): one card, a half per section. Halves size to their
     content so the afternoon slot sits right under the morning one, not pinned to the bottom. */
  .halves { flex: 0 1 auto; min-height: 0; display: flex; align-items: stretch; padding-bottom: .5em; }
  .half { flex: 1 1 0; min-width: 0; }
  .half + .half { border-left: 2px solid var(--panel); }
  .half h3 {
    margin: .3em .45em 0; font-size: .7em; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; color: var(--teal);
  }
  .card > .slots { padding-bottom: .5em; }
  .slot {
    padding: .15em .45em .2em;
    border-left: .25em solid var(--teal);
    margin: .3em .35em 0;
    overflow-wrap: break-word;
  }
  .slot.pm { border-left-color: var(--orange); }
  .slot.note { border-left-color: var(--green); font-size: .8em; }
  .when { font-size: .78em; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--am-ink); }
  .pm > .when { color: var(--pm-ink); }
  .theme { font-weight: 400; line-height: 1.2; margin-top: .05em; }
  .theme.empty { color: var(--muted); font-style: italic; font-weight: 400; }
  .more {
    display: inline-block; vertical-align: .1em; margin-left: .3em; padding: 0 .35em;
    font-size: .62em; font-weight: 700; letter-spacing: .04em; line-height: 1.5;
    color: #fff; background: var(--teal); border-radius: .7em;
  }
  .banner { padding: .8em .6em; text-align: center; font-weight: 700; color: var(--navy); font-size: 1.05em; margin: auto 0; }
  .card.special .slots { flex: 1 1 auto; display: flex; }
  .card.special .banner { margin: auto; }

  /* ---------- phone / narrow screens ---------- */
  body.mobile header { position: sticky; top: 0; z-index: 3; padding: 8px 16px; gap: 12px; border-bottom-width: 4px; }
  body.mobile header .logo { height: 44px; }
  body.mobile header h1 { font-size: 21px; }
  body.mobile header .sub, body.mobile header .qr { display: none; }
  body.mobile main { display: block; padding: 12px 16px 48px; }
  body.mobile .group { display: block; margin-bottom: 16px; }
  body.mobile .group.labelled { padding: 8px 8px 2px; border-radius: 8px; border-top-width: 4px; }
  body.mobile .glabel { font-size: 14px; padding: 2px 4px 8px; }
  body.mobile .row { display: block; }
  body.mobile .card { --u: 17px; --uh: 19px; margin-bottom: 10px; border-radius: 8px; }
  body.mobile .halves { display: block; }
  body.mobile .half + .half { border-left: 0; border-top: 2px solid var(--panel); margin-top: .3em; }
  body.mobile #bar { display: none; }
  body.mobile #status { position: static; padding: 0 16px 16px; }

  /* ---------- detail sheet ---------- */
  #detail {
    position: fixed; inset: 0; z-index: 10; background: rgba(0,26,48,.55);
    display: flex; align-items: center; justify-content: center; padding: 3vh 3vw;
  }
  #detail[hidden] { display: none; }
  #detail .sheet {
    background: #fff; border-radius: 12px; width: min(760px, 100%); max-height: 100%; overflow: auto;
    box-shadow: 0 10px 40px rgba(0,0,0,.3); font-size: 19px; position: relative;
  }
  #detail h2 { margin: 0; background: var(--navy); color: #fff; font-size: 1.35em; padding: .55em 2.6em .55em .8em; position: sticky; top: 0; }
  #detail .close {
    position: absolute; top: .35em; right: .4em; z-index: 1; width: 1.9em; height: 1.9em; border: 0; border-radius: 50%;
    background: rgba(255,255,255,.18); color: #fff; font: 700 1.3em/1 Arial, sans-serif; cursor: pointer;
  }
  #detail .part { padding: .2em .9em .9em; }
  #detail .part + .part { border-top: 2px solid var(--panel); }
  #detail h3 { margin: .6em 0 0; font-size: .8em; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--teal); }
  #detail .slot { margin: .6em 0 0; padding: .2em .7em .3em; }
  #detail .when { font-size: .75em; }
  #detail ul { margin: .35em 0 0; padding-left: 1.1em; color: #3a4b5b; font-size: .9em; line-height: 1.35; }
  #detail li + li { margin-top: .25em; }
  body.mobile #detail { align-items: flex-end; padding: 0; }
  body.mobile #detail .sheet { border-radius: 14px 14px 0 0; max-height: 88vh; font-size: 17px; }

  /* ---------- chrome ---------- */
  #bar {
    position: fixed; right: 10px; bottom: 10px; display: flex; gap: 6px;
    opacity: 0; transition: opacity .2s; z-index: 5;
  }
  body:hover #bar { opacity: 1; }
  #bar button, #bar span {
    font: 13px Arial, sans-serif; border: 0; border-radius: 6px; padding: 6px 10px;
    background: var(--navy); color: #fff; cursor: pointer;
  }
  #bar span { background: #555; cursor: default; }
  #status { position: fixed; left: 10px; bottom: 8px; font: 12px Arial, sans-serif; color: var(--muted); z-index: 5; }
  #status.bad { color: #b3261e; font-weight: 700; }
</style>
</head>
<body class="present">
<header>
  <img class="logo" src="logo.png" alt="Together for Good 2026">
  <h1>Topic Marketplace</h1>
  <div class="sub" id="sub"></div>
  <a class="qr" id="qr" href="./"><span><b>Scan to open this board on your phone</b><br>Tap topics marked <span class="more">More</span> for extra details</span><img src="qr.svg" alt="QR code for this page"></a>
</header>
<main id="grid"></main>
<div id="detail" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <button class="close" id="detail-close" aria-label="Close">×</button>
    <div id="detail-body"></div>
  </div>
</div>
<div id="bar">
  <span id="mode">Demo data</span>
  <button id="btn-full" title="Fullscreen (F)">Fullscreen (F)</button>
</div>
<div id="status"></div>

<script>
/* ============================ CONFIG ============================ */
// Live mode: paste the Google Sheet ID (from its URL) and set the tab name.
// Leave SHEET_ID empty to run with the sample data below.
const CONFIG = {
  SHEET_ID: "1Iykh5KMN1ZIvUTDodyzPvrXzGKMAu1NVQcG4JtWa_F0",
  SHEET_TAB: "Display",
  POLL_MS: 3000,
  AM_LABEL: "Morning",
  PM_LABEL: "Afternoon",
  COLS: "auto",                  // max room-units per row, or "auto" to pick the layout with the largest text
  LAYOUT: "side",                // "stacked" (groups top to bottom), "side" (groups side by side), or "auto" (largest text wins)
  SUBTITLE: "",                  // optional line beside the title; empty hides it
  MOBILE_QUERY: "(max-width: 820px), (max-aspect-ratio: 4/5)", // phones and portrait tablets get the scrolling list
};

/* Sheet columns, left to right (header row is row 1; order = row order):
   A Room | B AM theme | C AM context | D PM theme | E PM context | F Note | G Group
   Themes show on the board; context lines (one per line in the cell) show when a card is tapped.
   Note: if both themes are blank, the Note fills the card (e.g. "Reset Room - open all day").
   Rooms named "<Name> - <n>" (Canal - 1, Canal - 2) share one card, split into halves.
   Group: rooms with the same Group sit together under that label; leave all blank for no grouping. */

/* Sample data for when SHEET_ID is empty. */
const SAMPLE = [
  { room: "Canal - 1", group: "Ballroom", amT: "How do we become more of an embedded community partner?",
    amC: ["Alternative funding that relies on existing community systems", "Reaching isolated communities without exploitation"], pmT: "", pmC: [], note: "" },
  { room: "Canal - 2", group: "Ballroom", amT: "The power of maybe: sitting with uncertainty in a polycrisis", amC: [],
    pmT: "How do we refocus our conversations for the long term?", pmC: ["Matchmaking on staff and resource sharing"], note: "" },
  { room: "Rotunda", group: "Ballroom", amT: "How to assess people’s accurate capacity", amC: [], pmT: "How to break through board dysfunction?", pmC: [], note: "" },
  { room: "Board Room", group: "Meeting rooms", amT: "", amC: [], pmT: "", pmC: [], note: "Reset Room - open all day" },
  { room: "Room 415", group: "Meeting rooms", amT: "How to involve board members in the work", amC: [], pmT: "", pmC: [], note: "" },
  { room: "Room 515", group: "Meeting rooms", amT: "", amC: [], pmT: "", pmC: [], note: "" },
];

/* ============================ STATE ============================ */
const $ = (s) => document.querySelector(s);
const grid = $("#grid");
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const live = !!CONFIG.SHEET_ID;
const mq = matchMedia(CONFIG.MOBILE_QUERY);
let rooms = live ? (LS.get("tm_last_good") || []) : SAMPLE;
let openKey = null; // name of the card whose details are showing

/* ============================ BUILD ============================ */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = String(text).replace(/\//g, "/​"); // let "a/b/c" wrap after slashes
  return e;
}
const hasTopic = (p) => p.amT || p.pmT || p.note;
const isSpecial = (p) => !p.amT && !p.pmT && p.note;

// Sheet rows -> cards -> groups. "Canal - 1" and "Canal - 2" become one "Canal" card with two parts.
function cardsByGroup() {
  const groups = new Map(), byName = new Map();
  rooms.forEach((r) => {
    const m = r.room.match(/^(.*\S)\s+-\s+(\S+)$/);
    const g = r.group || "", base = m ? m[1] : r.room, key = g + "|" + base;
    const part = { ...r, label: m ? base + " " + m[2] : r.room };
    if (m && byName.has(key)) { byName.get(key).parts.push(part); return; }
    const card = { key, name: base, parts: [part] };
    if (m) byName.set(key, card);
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(card);
  });
  groups.forEach((cards) => cards.forEach((c) => { if (c.parts.length === 1) c.name = c.parts[0].room; }));
  return [...groups].map(([name, cards]) => ({ name, cards, units: cards.reduce((a, c) => a + c.parts.length, 0) }));
}

// Split a group's cards into n rows of roughly equal width (in room-units).
function splitRows(cards, n) {
  const total = cards.reduce((a, c) => a + c.parts.length, 0), rows = [[]];
  let acc = 0;
  cards.forEach((c) => {
    if (rows.length < n && rows[rows.length - 1].length && acc + c.parts.length / 2 > total * rows.length / n) rows.push([]);
    rows[rows.length - 1].push(c);
    acc += c.parts.length;
  });
  return rows;
}

// Board view of one room section: themes only, with a "More" tag when there's context behind a tap.
function slotsEl(p) {
  const box = el("div", "slots");
  if (isSpecial(p)) { box.appendChild(el("div", "banner", p.note)); return box; }
  [["am", CONFIG.AM_LABEL, p.amT, p.amC], ["pm", CONFIG.PM_LABEL, p.pmT, p.pmC]].forEach(([kind, label, theme, ctx]) => {
    const s = el("div", "slot " + kind);
    s.appendChild(el("div", "when", label));
    const t = el("div", "theme" + (theme ? "" : " empty"), theme || "Topic coming soon");
    if (theme && ctx.length) t.appendChild(el("span", "more", "More"));
    s.appendChild(t);
    box.appendChild(s);
  });
  if (p.note) box.appendChild(el("div", "slot note", p.note));
  return box;
}

function cardEl(c) {
  const card = el("section", "card");
  card.style.setProperty("--w", c.parts.length);
  card.dataset.filled = c.parts.some(hasTopic) ? "1" : "";
  card.tabIndex = 0;
  card.setAttribute("role", "button");
  card.setAttribute("aria-label", c.name + ": show details");
  card.onclick = () => openDetail(c.key);
  card.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetail(c.key); } };
  card.appendChild(el("h2", null, c.name));
  if (c.parts.length === 1) {
    if (isSpecial(c.parts[0])) card.classList.add("special");
    card.appendChild(slotsEl(c.parts[0]));
  } else {
    const halves = el("div", "halves");
    c.parts.forEach((p) => {
      const half = el("div", "half");
      half.appendChild(el("h3", null, p.label));
      half.appendChild(slotsEl(p));
      halves.appendChild(half);
    });
    card.appendChild(halves);
  }
  return card;
}

// Stacked: at most `n` room-units per row. Side: every group gets `n` rows, width by its column count.
function build(groups, n, side) {
  grid.replaceChildren();
  grid.classList.toggle("side", !!side);
  const labelled = groups.some((g) => g.name);
  groups.forEach((g, i) => {
    const rows = splitRows(g.cards, side ? Math.min(n, g.cards.length) : Math.ceil(g.units / n));
    const box = el("div", "group" + (labelled && g.name ? " labelled tone-" + (i % 2) : ""));
    box.style.flexGrow = side ? Math.ceil(g.units / rows.length) : rows.length;
    if (labelled && g.name) box.appendChild(el("div", "glabel", g.name));
    rows.forEach((cards) => { const row = el("div", "row"); cards.forEach((c) => row.appendChild(cardEl(c))); box.appendChild(row); });
    grid.appendChild(box);
  });
}

// Phones get one scrolling column. The projector tries each row width and keeps the one where the text is largest.
function render() {
  const mobile = mq.matches;
  document.body.classList.toggle("mobile", mobile);
  document.body.classList.toggle("present", !mobile);
  const groups = cardsByGroup();
  if (!groups.length) { grid.replaceChildren(); return; }
  if (mobile) {
    build(groups, Infinity);
  } else {
    const maxUnits = Math.max(...groups.map((g) => g.units));
    const ns = CONFIG.COLS === "auto" ? Array.from({ length: maxUnits }, (_, k) => k + 1) : [CONFIG.COLS];
    const sides = groups.length < 2 || CONFIG.LAYOUT === "stacked" ? [false] : CONFIG.LAYOUT === "side" ? [true] : [false, true];
    const options = sides.flatMap((side) => ns.map((n) => [n, side]));
    let best = options[0], bestScore = -1;
    if (options.length > 1) options.forEach((o) => { build(groups, ...o); const s = fit(); if (s > bestScore) { best = o; bestScore = s; } });
    build(groups, ...best);
    fit();
  }
  if (openKey) fillDetail();
}

/* ============================ FIT TEXT (projector) ============================ */
// Each card gets the largest text size at which nothing overflows, capped at the median filled card's
// size so most cards match and only the wordiest shrink. Empty cards don't count toward the median.
function overflows(card) {
  if (card.scrollHeight > card.clientHeight + 1) return true;
  const h = card.querySelector(".halves");
  return !!h && h.scrollHeight > h.clientHeight + 1;
}
function bestSize(card, lo, hi) {
  let best = lo;
  for (let n = 0; n < 10; n++) {
    const mid = (lo + hi) / 2;
    card.style.setProperty("--u", mid + "px");
    if (overflows(card)) hi = mid; else { best = mid; lo = mid; }
  }
  return best;
}
function fit() {
  const cards = [...grid.querySelectorAll(".card")];
  if (!cards.length) return 0;
  const root = document.documentElement;
  const max = Math.max(14, innerHeight / 28);
  root.style.setProperty("--uh", innerHeight / 36 + "px");
  const sizes = cards.map((c) => bestSize(c, 8, max));
  const sorted = sizes.filter((_, i) => cards[i].dataset.filled).sort((a, b) => a - b);
  const cap = sorted.length ? sorted[Math.floor((sorted.length - 1) / 2)] : max;
  const final = sizes.map((s) => Math.min(s, cap));
  cards.forEach((c, i) => c.style.setProperty("--u", final[i] + "px"));
  // Layout score: the common size, nudged by the smallest so one crushed card loses.
  return cap + 0.5 * Math.min(...final);
}

/* ============================ DETAIL SHEET ============================ */
function openDetail(key) {
  openKey = key;
  fillDetail();
  $("#detail").hidden = false;
  $("#detail-close").focus();
}
function closeDetail() { openKey = null; $("#detail").hidden = true; }
function fillDetail() {
  const card = cardsByGroup().flatMap((g) => g.cards).find((c) => c.key === openKey);
  if (!card) return closeDetail();
  const body = $("#detail-body");
  body.replaceChildren();
  const title = el("h2", null, card.name);
  title.id = "detail-title";
  body.appendChild(title);
  card.parts.forEach((p) => {
    const part = el("div", "part");
    if (card.parts.length > 1) part.appendChild(el("h3", null, p.label));
    if (isSpecial(p)) { part.appendChild(el("div", "banner", p.note)); body.appendChild(part); return; }
    [["am", CONFIG.AM_LABEL, p.amT, p.amC], ["pm", CONFIG.PM_LABEL, p.pmT, p.pmC]].forEach(([kind, label, theme, ctx]) => {
      const s = el("div", "slot " + kind);
      s.appendChild(el("div", "when", label));
      s.appendChild(el("div", "theme" + (theme ? "" : " empty"), theme || "Topic coming soon"));
      if (ctx.length) { const ul = el("ul"); ctx.forEach((line) => ul.appendChild(el("li", null, line))); s.appendChild(ul); }
      part.appendChild(s);
    });
    if (p.note) part.appendChild(el("div", "slot note", p.note));
    body.appendChild(part);
  });
}
$("#detail-close").onclick = closeDetail;
$("#detail").onclick = (e) => { if (e.target.id === "detail") closeDetail(); };

/* ============================ CONTROLS ============================ */
$("#btn-full").onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDetail();
  if ((e.key === "f" || e.key === "F") && !mq.matches) $("#btn-full").click();
});
window.addEventListener("resize", render);
mq.addEventListener("change", render);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);

/* ============================ LIVE MODE (Google Sheet) ============================ */
// Fetches the Sheet's gviz JSON with no cookies, so every device gets the same anonymous response
// (a script-tag/JSONP load sent the viewer's Google cookies, and a signed-in phone could get a
// non-data reply that never fired a callback). Google allows this cross-origin read.
// Sheet must be shared "Anyone with the link can view".
function parseRows(table) {
  const get = (c, i) => (c[i] && c[i].v != null ? String(c[i].v).trim() : "");
  const lines = (s) => s.split(/\r?\n/).map((x) => x.trim()).filter(Boolean);
  return table.rows
    .map((r) => r.c || [])
    .filter((c) => get(c, 0))
    .map((c) => ({ room: get(c, 0), amT: get(c, 1), amC: lines(get(c, 2)), pmT: get(c, 3), pmC: lines(get(c, 4)), note: get(c, 5), group: get(c, 6) }));
}
let lastOk = 0, failures = 0, polling = false;
async function poll() {
  if (polling) return; // a slow reply shouldn't stack requests
  polling = true;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
  try {
    const url = "https://docs.google.com/spreadsheets/d/" + CONFIG.SHEET_ID + "/gviz/tq?tqx=out:json&headers=1&sheet=" +
                encodeURIComponent(CONFIG.SHEET_TAB) + "&_=" + Date.now();
    const res = await fetch(url, { credentials: "omit", cache: "no-store", signal: ctl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const m = (await res.text()).match(/setResponse\(([\s\S]*)\);?\s*$/);
    if (!m) throw new Error("unexpected reply");
    const resp = JSON.parse(m[1]);
    if (resp.status !== "ok") throw new Error("sheet error");
    const next = parseRows(resp.table);
    lastOk = Date.now(); failures = 0;
    if (JSON.stringify(next) !== JSON.stringify(rooms)) { rooms = next; LS.set("tm_last_good", rooms); render(); }
  } catch (e) {
    failures++;
    console.warn("[topic-marketplace] sheet fetch failed:", e.message || e);
  } finally {
    clearTimeout(timer);
    polling = false;
    showStatus();
  }
}
function showStatus() {
  const st = $("#status");
  const t = lastOk && new Date(lastOk).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
  st.className = failures >= 3 || (!lastOk && failures) ? "bad" : "";
  if (!lastOk) st.textContent = failures ? (rooms.length ? "Can't reach the topic sheet: showing saved topics, retrying" : "Can't reach the topic sheet: retrying") : "Loading topics…";
  else st.textContent = failures >= 3 ? "Offline: showing last data (updated " + t + ")" : "Updated " + t;
}

/* ============================ INIT ============================ */
$("#sub").textContent = CONFIG.SUBTITLE;
render();
if (live) {
  $("#mode").textContent = "Live: Google Sheet";
  showStatus();
  poll(); setInterval(poll, CONFIG.POLL_MS);
} else {
  $("#status").textContent = "Demo data";
}
</script>
